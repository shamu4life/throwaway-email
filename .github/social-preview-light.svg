<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="glow" cx="50%" cy="39%" r="32%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Light background -->
  <rect width="1280" height="640" fill="#ffffff"/>
  <!-- Subtle pink glow behind icon -->
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- Icon: pink rounded square -->
  <rect x="570" y="180" width="140" height="140" rx="28" fill="#db2777"/>
  <!-- Envelope body -->
  <rect x="600" y="224" width="80" height="52" rx="7" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
  <!-- Envelope flap -->
  <polyline points="604,228 640,255 676,228" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark (dark — for light backgrounds) -->
  <text x="640" y="415" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="900" font-size="96" text-anchor="middle" letter-spacing="-3"><tspan fill="#16161d">ShitPost</tspan><tspan fill="#db2777">.email</tspan></text>
  <!-- Tagline -->
  <text x="640" y="462" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="400" font-size="26" fill="#6b6b6b" text-anchor="middle">Disposable email, no bullshit.</text>
  <!-- Pink accent bar -->
  <rect x="0" y="628" width="1280" height="3" fill="#db2777" opacity="0.6"/>
</svg>
