name = "throwaway-email"
main = "worker.js"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "KV"
id      = "39574b78356244e2a1db30eb487d2c78"

[[routes]]
pattern   = "shitpost.email/*"
zone_name = "shitpost.email"

# Cloudflare Email Service sending binding — env.EMAIL.send() re-mails redirect
# mail (primary path; Resend is the fallback via the RESEND_API_KEY secret).
[[send_email]]
name = "EMAIL"

# Workers logs + traces. head_sampling_rate = 1 keeps every invocation while
# volume is low; lower it if request volume grows.
[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1
